      "name": "How much does counselling cost?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Counselling is free for every country, including Italy. For most countries our application help is also free — you only pay the university's own application fee, if it charges one, directly to the university. Ivy League applications are charged per application. Italy has one full process fee covering everything from scratch to the visa, including applications to up to three universities, with a 100% scholarship guaranteed for eligible students. Small official charges such as the visa fee, HRD attestation and registration are paid by you separately. Any fee that applies is confirmed in writing before you commit."
      }
    },

      "@type": "Question",
      "name": "Who will guide me?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "HN Overseas has guided students for 35+ years, since 1985, as part of the Career Point family — 3,500+ students counselled, 1,500+ universities across 41+ countries. Your counselling is led by a mentor who is British Council Certified, with 10+ years of experience and 4,000+ students counselled, and the team stays with you from the first conversation to your arrival."
      }
    },
    {
      "@type": "Question",
      "name": "Which countries can I study in?",

        "@type": "Answer",

      }
    },
    {
      "@type": "Question",
      "name": "When are the intakes, and when should I apply?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "It differs by country. USA: Fall, Spring and Summer. UK: September and January, with May for some postgraduate courses. Canada: September, January and May. Australia: February, July and November. Ireland: September, with January for some postgraduate courses. UAE: September, January and May. New Zealand: February, July and November. Singapore: August and January. Italy has a single September intake. Whichever country you choose, starting early matters — most families miss scholarships only because they start late."
      }
    },
    {
      "@type": "Question",
      "name": "Can I work part-time while I study?",
      "acceptedAnswer": {
        "@type": "Answer",

      }
    },
    {
      "@type": "Question",
      "name": "Can I stay back after my degree?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Most destinations offer a post-study route. Australia's Temporary Graduate Visa (Subclass 485) allows two to four years, depending on your qualification and where you study. Canada's Post-Graduation Work Permit can run for up to three years. The UK Graduate Route gives two years after an undergraduate or Master's degree, and up to three years after a PhD. New Zealand allows up to three years, depending on the level of your qualification. Italy offers a 1-year post-study stay-back."

        "@type": "Answer",

      }

      }
    },
    {
      "@type": "Question",

        "@type": "Answer",

      }

      }
    },
    {
      "@type": "Question",

        "@type": "Answer",

      }

      "@type": "Question",
